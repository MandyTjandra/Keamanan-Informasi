version: '3.8'

networks:
  ki_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:
  kdc:
    build: .
    container_name: ki_kdc
    networks:
      ki_net:
        ipv4_address: 172.20.0.10
    stdin_open: true
    tty: true

  bob:
    build: .
    container_name: ki_bob
    networks:
      ki_net:
        ipv4_address: 172.20.0.30
    stdin_open: true
    tty: true

  alice:
    build: .
    container_name: ki_alice
    networks:
      ki_net:
        ipv4_address: 172.20.0.20
    stdin_open: true
    tty: true